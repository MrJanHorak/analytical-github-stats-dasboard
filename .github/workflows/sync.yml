name: Sync GitHub stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          # The default GITHUB_TOKEN can't read traffic for your other repos — use a PAT.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
